services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caca
      POSTGRES_PASSWORD: caca
      POSTGRES_DB: caca_dev
    ports:
      - "5432:5432"
    volumes:
      - caca_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caca"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://caca:caca@db:5432/caca_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-secret-change-in-production
      ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./migrations:/app/migrations
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  caca_db_data: