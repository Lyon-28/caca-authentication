<!DOCTYPE html>
<html lang="en">

<head>
  <title>Caca Auth — API Reference</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="https://fastapi.tiangolo.com/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #ffffff;
      --bg-panel: #f7f8fa;
      --line: #e2e5ea;
      --accent: #0a7d54;
      --accent-dim: #0a5c3f;
      --text: #14181f;
      --text-dim: #6b7280;
    }
    
    * {
      box-sizing: border-box;
    }
    
    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
    }
    
    /* ---- Boot screen ---- */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: 'JetBrains Mono', monospace;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    
    #boot-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .boot-box {
      width: min(520px, 88vw);
      border: 1px solid var(--line);
      background: var(--bg-panel);
      border-radius: 6px;
      padding: 28px 28px 24px;
    }
    
    .boot-title {
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .boot-title .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(10, 125, 84, 0.35);
      animation: pulse 1.4s ease-in-out infinite;
    }
    
    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }
      
      50% {
        opacity: 0.35;
      }
    }
    
    .boot-line {
      color: var(--text-dim);
      font-size: 12.5px;
      line-height: 1.9;
      opacity: 0;
      animation: appear 0.25s ease forwards;
    }
    
    .boot-line .ok {
      color: var(--accent-dim);
    }
    
    .boot-line .val {
      color: var(--text);
    }
    
    @keyframes appear {
      to {
        opacity: 1;
      }
    }
    
    .boot-bar-track {
      margin-top: 18px;
      height: 3px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .boot-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      animation: fill 1.6s ease forwards;
      animation-delay: 0.3s;
    }
    
    @keyframes fill {
      to {
        width: 100%;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {

      .boot-line,
      .boot-bar-fill,
      .boot-title .dot {
        animation: none;
        opacity: 1;
        width: 100%;
      }
    }
    
    /* ---- Top bar above ReDoc ---- */
    #topbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Inter', sans-serif;
    }
    
    #topbar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    #topbar .brand-mark {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(10, 125, 84, 0.35);
    }
    
    #topbar .brand-name {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    
    #topbar .brand-tag {
      color: var(--text-dim);
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }
    
    #topbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12.5px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 4px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    
    #topbar a:hover {
      color: var(--accent);
      border-color: var(--accent-dim);
    }
    
    /* ---- ReDoc container theming assist ---- */
    #redoc-container {
      background: var(--bg);
    }
  </style>
</head>

<body>
  
  <div id="boot-screen">
    <div class="boot-box">
      <div class="boot-title"><span class="dot"></span> CACA AUTH · SECURE API GATEWAY</div>
      <div class="boot-line" style="animation-delay:0.05s">&gt; verifying tenant isolation ... <span class="ok">ok</span></div>
      <div class="boot-line" style="animation-delay:0.25s">&gt; loading endpoint registry ... <span class="ok">ok</span></div>
      <div class="boot-line" style="animation-delay:0.45s">&gt; establishing schema <span class="val">openapi.json</span> ... <span class="ok">ok</span></div>
      <div class="boot-line" style="animation-delay:0.65s">&gt; rendering reference<span id="dots">...</span></div>
      <div class="boot-bar-track">
        <div class="boot-bar-fill"></div>
      </div>
    </div>
  </div>
  
  <div id="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">CACA AUTH</span>
      <span class="brand-tag">/ api reference</span>
    </div>
    <a href="/docs">try it in Swagger →</a>
  </div>
  
  <div id="redoc-container">
    <redoc spec-url="/openapi.json" theme='{
           "colors": {
             "primary": { "main": "#0a7d54" },
             "success": { "main": "#0a7d54" },
             "error": { "main": "#d64545" },
             "text": { "primary": "#14181f", "secondary": "#6b7280" },
             "border": { "dark": "#e2e5ea", "light": "#eef0f3" },
             "http": {
               "get": "#0a7d54",
               "post": "#1d6fd6",
               "put": "#c47a06",
               "delete": "#d64545",
               "patch": "#9a5cc9",
               "basic": "#6b7280"
             }
           },
           "sidebar": {
             "backgroundColor": "#f7f8fa",
             "textColor": "#14181f",
             "activeTextColor": "#0a7d54",
             "groupItems": { "activeBackgroundColor": "#eef0f3" },
             "level1Items": { "activeBackgroundColor": "#eef0f3" }
           },
           "rightPanel": {
             "backgroundColor": "#14181f",
             "textColor": "#e6e9ee"
           },
           "codeBlock": {
             "backgroundColor": "#14181f"
           },
           "typography": {
             "fontFamily": "Inter, sans-serif",
             "headings": { "fontFamily": "JetBrains Mono, monospace", "color": "#14181f" },
             "code": { "fontFamily": "JetBrains Mono, monospace", "color": "#0a5c3f", "backgroundColor": "#f7f8fa" },
             "links": { "color": "#0a7d54" }
           }
         }'>
    </redoc>
  </div>
  
  <script src="https://unpkg.com/redoc@2.1.3/bundles/redoc.standalone.js"></script>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('boot-screen').classList.add('hidden');
      }, 900);
    });
  </script>
  
</body>

</html>
